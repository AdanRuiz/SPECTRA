<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 572" width="1024" height="572" role="img" aria-labelledby="t">
  <title id="t">SPECTRA — Agentic Research Framework</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1a2944"/>
      <stop offset="1" stop-color="#0a1222"/>
    </radialGradient>

    <!-- Un degradado por tramo de la "S" para lograr el efecto arcoíris -->
    <linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="396" y1="168" x2="512" y2="100">
      <stop offset="0" stop-color="#7a4dff"/><stop offset="1" stop-color="#d9338f"/>
    </linearGradient>
    <linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="512" y1="100" x2="628" y2="168">
      <stop offset="0" stop-color="#e0306f"/><stop offset="1" stop-color="#ff9a2e"/>
    </linearGradient>
    <linearGradient id="g3" gradientUnits="userSpaceOnUse" x1="396" y1="168" x2="396" y2="232">
      <stop offset="0" stop-color="#7a4dff"/><stop offset="1" stop-color="#5a5cf0"/>
    </linearGradient>
    <linearGradient id="g4" gradientUnits="userSpaceOnUse" x1="396" y1="232" x2="628" y2="268">
      <stop offset="0" stop-color="#5a5cf0"/><stop offset=".5" stop-color="#2fc6e8"/><stop offset="1" stop-color="#8fe04a"/>
    </linearGradient>
    <linearGradient id="g5" gradientUnits="userSpaceOnUse" x1="628" y1="268" x2="628" y2="316">
      <stop offset="0" stop-color="#8fe04a"/><stop offset="1" stop-color="#3ad6a0"/>
    </linearGradient>
    <linearGradient id="g6" gradientUnits="userSpaceOnUse" x1="628" y1="316" x2="512" y2="384">
      <stop offset="0" stop-color="#3ad6a0"/><stop offset="1" stop-color="#22b8f0"/>
    </linearGradient>
    <linearGradient id="g7" gradientUnits="userSpaceOnUse" x1="512" y1="384" x2="396" y2="316">
      <stop offset="0" stop-color="#22b8f0"/><stop offset="1" stop-color="#5b5cf2"/>
    </linearGradient>
    <linearGradient id="g8" gradientUnits="userSpaceOnUse" x1="396" y1="316" x2="396" y2="290">
      <stop offset="0" stop-color="#5b5cf2"/><stop offset="1" stop-color="#7a4dff"/>
    </linearGradient>

    <linearGradient id="prism" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8f0ff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#1fa3d6" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="prismSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee8c8" stop-opacity=".6"/>
      <stop offset="1" stop-color="#2a7fd0" stop-opacity=".2"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#e6ebf2"/>
      <stop offset=".55" stop-color="#b9c2cf"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>


  <!-- Red de nodos (detrás) -->
  <g stroke="#cfe3ff" stroke-opacity=".35" stroke-width="1.2" fill="none">
    <path d="M370 240 L420 228 L445 195 L478 150 L512 168 L548 148 L600 202 L640 228"/>
    <path d="M445 195 L512 168 M548 148 L560 215 L600 202 M420 228 L470 270 L512 300 L560 215"/>
    <path d="M512 300 L585 312 L640 228 M470 270 L430 300 M585 312 L610 340"/>
  </g>

  <!-- La "S" isométrica: la máscara da la silueta limpia; los tramos de color van dentro -->
  <mask id="sMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="572">
    <polyline points="628,168 512,100 396,168 396,232 628,268 628,316 512,384 396,316 396,290"
              fill="none" stroke="#fff" stroke-width="34" stroke-linejoin="miter" stroke-miterlimit="10" stroke-linecap="butt"/>
  </mask>
  <g mask="url(#sMask)" fill="none" stroke-width="60" stroke-linecap="square" opacity=".92">
    <line x1="396" y1="168" x2="512" y2="100" stroke="url(#g1)"/>
    <line x1="512" y1="100" x2="628" y2="168" stroke="url(#g2)"/>
    <line x1="396" y1="168" x2="396" y2="232" stroke="url(#g3)"/>
    <line x1="396" y1="232" x2="628" y2="268" stroke="url(#g4)"/>
    <line x1="628" y1="268" x2="628" y2="316" stroke="url(#g5)"/>
    <line x1="628" y1="316" x2="512" y2="384" stroke="url(#g6)"/>
    <line x1="512" y1="384" x2="396" y2="316" stroke="url(#g7)"/>
    <line x1="396" y1="316" x2="396" y2="292" stroke="url(#g8)"/>
  </g>
  <!-- Brillo de vidrio sobre la S -->
  <polyline points="396,175 512,107 628,175" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2"/>
  <polyline points="628,323 512,391 396,323" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
  <line x1="403" y1="225" x2="621" y2="259" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>

  <!-- Prisma central -->
  <g>
    <polygon points="512,168 462,282 528,268" fill="url(#prism)"/>
    <polygon points="512,168 528,268 566,282" fill="url(#prismSide)"/>
    <polygon points="462,282 528,268 566,282" fill="#9fe8ff" fill-opacity=".25"/>
    <g fill="none" stroke="#e8fbff" stroke-opacity=".8" stroke-width="1.5" stroke-linejoin="round">
      <polygon points="512,168 462,282 566,282"/>
      <line x1="512" y1="168" x2="528" y2="268"/>
      <polyline points="462,282 528,268 566,282"/>
    </g>
  </g>

  <!-- Nodos con brillo -->
  <g filter="url(#glow)">
    <circle cx="478" cy="150" r="5" fill="#d6c9ff"/>
    <circle cx="548" cy="148" r="5" fill="#ffc48a"/>
    <circle cx="512" cy="168" r="6" fill="#ffffff"/>
    <circle cx="600" cy="202" r="6" fill="#ffd27a"/>
    <circle cx="445" cy="195" r="4" fill="#b9a8ff"/>
    <circle cx="560" cy="215" r="5" fill="#ffe08a"/>
    <circle cx="420" cy="228" r="5" fill="#a9b8ff"/>
    <circle cx="370" cy="240" r="4" fill="#8fa8ff"/>
    <circle cx="640" cy="228" r="4" fill="#c7a07a"/>
    <circle cx="512" cy="300" r="6" fill="#7fe3ff"/>
    <circle cx="470" cy="270" r="4" fill="#bfe9ff"/>
    <circle cx="585" cy="312" r="4" fill="#9ff5c8"/>
    <circle cx="430" cy="300" r="3" fill="#a8c4ff"/>
    <circle cx="610" cy="340" r="3" fill="#8cf0d0"/>
  </g>

  <!-- Texto -->
  <text x="512" y="476" text-anchor="middle"
        font-family="'Orbitron','Exo 2','Rajdhani','Eurostile','Segoe UI',Arial,sans-serif"
        font-size="74" font-weight="700" letter-spacing="6" fill="url(#metal)">SPECTRA</text>
  <text x="512" y="518" text-anchor="middle"
        font-family="'Exo 2','Rajdhani','Segoe UI',Arial,sans-serif"
        font-size="19" font-weight="500" letter-spacing="3.5" fill="#c4ccda">AGENTIC RESEARCH FRAMEWORK</text>
</svg>
